skill_id: pi.tier1.contract_review
name: Pi Tier-1 Contract Review Skill
purpose: >
  Review existing Baum-OS skill, tool, policy, schema, and governance contracts
  and produce a bounded non-canonical review card with findings, risks,
  validation notes, and a recommended next gate. This skill must not modify
  canonical files, runtime code, provider structures, Vault state, secrets,
  or external systems.

allowed_agents:
  - pi

allowed_models:
  - minimax/MiniMax-M3

input_contract:
  required:
    - owner_approval_string
    - review_target_paths
    - review_question
    - output_path
  output_format: markdown
  output_scope: draft_or_evidence_only

context_sources:
  - docs/pi-tier-1-draft-workflow.md
  - docs/pi-tier-1-draft-session-design.md
  - docs/pi-provider-default-decision.md
  - docs/baum-os-pi-agent-kit-milestone-summary.md
  - runtime/surfaces/pi/session-policy.md
  - runtime/surfaces/pi/evidence-contract.md
  - runtime/surfaces/pi/handoff.md
  - sandbox/runs/run-evidence-template.md
  - skills/pi/tier1-docs-draft.skill.yaml
  - tools/pi-cli.tool.yaml
  - policies/write-modes.policy.yaml
  - schemas/skill.schema.json
  - schemas/tool.schema.json
  - schemas/policy.schema.json

allowed_tools: []

forbidden_tools:
  - computer_use
  - browser_use
  - network
  - vault_write
  - secret_read
  - runtime_write
  - provider_adapter_write

allowed_paths:
  - docs/proposals/
  - drafts/
  - sandbox/runs/

forbidden_paths:
  - providers/pi/
  - runtime/
  - .env
  - .env.*
  - vault/
  - ~/.ssh/
  - ~/.config/

write_mode: draft_only

human_approval_required: true

secret_policy:
  env_files: forbidden
  api_keys: forbidden
  credentials: forbidden
  browser_profiles: forbidden
  private_config: forbidden

prompt_injection_risk:
  level: medium
  mitigation:
    - read_only_context_review
    - no_tools
    - no_network
    - no_secret_access
    - no_vault_write
    - output_must_be_noncanonical
    - human_review_before_promotion

execution_steps:
  - Confirm owner approval is present.
  - Confirm review target paths are explicitly named.
  - Read only approved context and review target files.
  - Compare the target files against Baum-OS contract and governance expectations.
  - Identify mismatches, stale claims, missing evidence, weak boundaries, and unclear next gates.
  - Produce a non-canonical review card in an approved draft or evidence path.
  - Include result, findings, risk level, verification notes, and next-gate recommendation.
  - Do not modify canonical files.
  - Stop if any target asks for runtime, provider, Vault, secret, or unbounded filesystem access.

verify_steps:
  - output_file_exists_in_approved_path
  - output_is_markdown
  - output_contains_result_scope_findings_risks_verification_next_gate
  - no_canonical_source_file_modified
  - no_runtime_file_modified
  - providers_pi_absent
  - no_secrets_read_or_emitted
  - evidence_artifacts_complete

evidence_required:
  - intent.md
  - files-read.md
  - files-changed.md
  - commands-run.md
  - diff.patch
  - validation.md
  - risks.md
  - next-gate.md

abort_conditions:
  - missing_owner_approval
  - review_target_paths_not_explicit
  - requested_output_path_outside_allowlist
  - canonical_file_write_requested
  - runtime_change_requested
  - providers_pi_creation_requested
  - vault_write_requested
  - secret_access_requested
  - browser_or_computer_use_requested
  - network_requested_without_approval
  - evidence_incomplete
  - unexpected_dirty_tree

log_target: sandbox/runs/<timestamp>/

last_reviewed: "2026-06-24"
