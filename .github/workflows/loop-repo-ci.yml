name: loop-repo-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  loop-repo-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: |
          node --check scripts/tools/baum-loop-repo.mjs
          node --check scripts/tools/validate-loop-run.mjs
          node --check scripts/tools/ci-gate.mjs
          node --check scripts/tools/skill-frontdoor-check.mjs
          node --check runtime/skills/frontdoor.mjs

      - name: Install pinned dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Runtime and security source syntax
        run: |
          find runtime scripts/tools providers -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Security boundary checks
        run: |
          npm run validate-secrets
          npm run scan-secrets
          node --test tests/tools/preinstall-skill-risk-check.test.mjs tests/tools/security-repair-regressions.test.mjs tests/tools/assurance-run-record.test.mjs tests/tools/safe-remove.test.mjs tests/tools/evidence-content-validation.test.mjs

      - name: Source security scan (the .mjs-capable static gate)
        run: npm run scan:source-security

      - name: Assurance run records (the durable evidence check)
        run: npm run validate:assurance-run -- --all

      - name: Persisted evidence content check (what the evidence must say)
        run: npm run validate:evidence-content -- --root . evidence/operational-safety-closure-2026-10-22/assurance-evidence-content.json

      - name: Merge executor lane binding (the cross-lane merge guard)
        run: |
          npm run test:merge-executor
          python3 -m unittest tests/tools/merge_lane_authorization_schema_test.py

      - name: Runtime vNext complete unit suite
        run: npm run test:vnext

      - name: Provider neutral and MiniMax adapter import tests
        run: |
          npm run validate-neutral
          node --test tests/tools/provider-adapter-import.test.mjs

      - name: Contract and security evals
        run: |
          npm run eval:maws-vnext
          npm run eval:secret-boundary
          npm run eval:provider-export-alignment

      - name: Validate MAWS vNext contracts
        run: npm run validate-maws-vnext

      - name: Skill frontdoor regression tests
        run: npm run test:skill-frontdoor

      - name: Validate repair Registry disposition
        run: node scripts/tools/validate-registry-disposition.mjs evidence/maws-security-repair-2026-10-20/registry-disposition.json

      - name: Validate the merge incident closure disposition
        run: node scripts/tools/validate-registry-disposition.mjs evidence/merge-pr-incident-closure-2026-10-21/registry-disposition.json

      - name: Loop repo CI gate
        run: node scripts/tools/ci-gate.mjs
